send_text:
  name: Send Text
  description: >-
    Send a string to the SplitFlap modules. The integration sends an explicit
    character target for every known module.
  fields:
    text:
      name: Text
      description: The text string to send to the display.
      required: true
      example: "HELLO WORLD"
      selector:
        text:
    start:
      name: Start module
      description: >-
        1-based module position where the text should begin. Modules before it
        and modules beyond the text are cleared (set to a blank flap).
      required: false
      default: 1
      example: 5
      selector:
        number:
          min: 1
          max: 9999
          mode: box

sync:
  name: Sync Modules
  description: Request current state and module info from ESP32 master.

scan:
  name: Discover Modules
  description: >-
    Discover modules by scanning every possible RS485 id (1-255). Use this after
    adding or removing hardware; it replaces the known module list.

update:
  name: Update Current Modules
  description: >-
    Refresh flaps and diagnostics for the modules that are already known. This
    is much faster than a full scan and does not add or remove modules.

calibrate:
  name: Calibrate Module
  description: >-
    Drive one module and persist calibration data. Use action `goto` to move to
    an expected flap, `home` to re-home, `apply` to write a new home offset
    and/or position-map entries, `clear_map` to erase the position map, or
    `refresh` to re-read the module configuration. When `apply` changes the
    home offset, existing position-map entries not listed in `positions` are
    shifted to stay valid; set `clear_map` to discard them instead.
  fields:
    action:
      name: Action
      description: The calibration step to run.
      required: true
      selector:
        select:
          options:
            - goto
            - home
            - apply
            - clear_map
            - refresh
            - step
    module_id:
      name: Module ID
      description: RS485 id of the module to calibrate.
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 255
          mode: box
    index:
      name: Flap index
      description: 0-based flap index for the `goto` action.
      required: false
      example: 1
      selector:
        number:
          min: 0
          max: 63
          mode: box
    flap:
      name: Flap character
      description: Alternative to `index` for `goto`; the first character is used.
      required: false
      example: "A"
      selector:
        text:
    home_offset:
      name: Home offset
      description: Steps from the Hall sensor edge to flap 0, used by `apply`.
      required: false
      example: 2704
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    positions:
      name: Position map
      description: >-
        Flap-index to step-position entries written by `apply`. Existing entries
        not listed here are kept.
      required: false
      selector:
        object:
    steps:
      name: Step target
      description: >-
        Absolute step position for the `step` action (0-based, modulo total steps).
      required: false
      example: 64
      selector:
        number:
          min: 0
          max: 65534
          mode: box
    clear_map:
      name: Clear position map
      description: >-
        Erase every position-map entry before applying. Used by the card when
        fixing the home offset so stale entries cannot fight the new reference.
      required: false
      selector:
        boolean:
