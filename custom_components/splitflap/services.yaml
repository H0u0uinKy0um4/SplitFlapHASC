send_text:
  name: Send Text
  description: >-
    Send a string to the SplitFlap modules. The integration sends an explicit
    character target for every known module.
  fields:
    text:
      name: Text
      description: The text string to send to the display.
      required: true
      example: "HELLO WORLD"
      selector:
        text:
    start:
      name: Start module
      description: >-
        1-based module position where the text should begin. Modules before it
        and modules beyond the text are cleared (set to a blank flap).
      required: false
      default: 1
      example: 5
      selector:
        number:
          min: 1
          max: 9999
          mode: box

sync:
  name: Sync Modules
  description: Request current state and module info from ESP32 master.

scan:
  name: Scan Bus
  description: Trigger an RS485 bus scan on the ESP32 master to discover modules.

update:
  name: Update Data
  description: Request data update from ESP32 faster than a full bus scan.
